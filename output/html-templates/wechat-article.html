<!DOCTYPE html>
<!-- 作者：阿洋 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
</head>
<body style="margin:0;padding:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Helvetica,Arial,sans-serif;color:#333;font-size:16px;line-height:1.75;">

<!-- 标题区 -->
<section style="padding:24px 16px 16px;text-align:center;">
  <h1 style="font-size:22px;font-weight:700;color:#1a1a1a;line-height:1.4;margin:0 0 12px;">{{TITLE}}</h1>
  <p style="font-size:13px;color:#999;margin:0;">{{AUTHOR}} · {{DATE}}</p>
</section>

<!-- 引导关注区 -->
<section style="margin:0 16px 16px;padding:12px;background:#f7f8fa;border-radius:8px;text-align:center;">
  <p style="font-size:13px;color:#888;margin:0;">点击上方蓝字关注，获取更多深度分析</p>
</section>

<!-- 正文区 -->
<section style="padding:0 16px;">
  {{BODY}}
</section>

<!-- 高亮块模板 -->
<!-- 
<blockquote style="margin:16px 0;padding:12px 16px;background:#f0f7ff;border-left:4px solid #0077cc;border-radius:0 4px 4px 0;">
  <p style="margin:0;font-size:15px;color:#444;">{{HIGHLIGHT_TEXT}}</p>
</blockquote>
-->

<!-- 引用块模板 -->
<!--
<blockquote style="margin:16px 0;padding:8px 16px;border-left:3px solid #ddd;color:#666;font-size:14px;">
  <p style="margin:0;">{{QUOTE_TEXT}}</p>
</blockquote>
-->

<!-- 文末签名区 -->
<section style="margin:32px 16px 24px;padding:16px 0;border-top:1px solid #eee;text-align:center;">
  <p style="font-size:13px;color:#999;margin:0 0 8px;">— END —</p>
  <p style="font-size:13px;color:#0077cc;margin:0;">关注我，获取更多深度内容</p>
  <p style="font-size:12px;color:#bbb;margin:4px 0 0;">{{AUTHOR_SIGNATURE}}</p>
</section>

</body>
</html>
