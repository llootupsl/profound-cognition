# ============================================================
# 全局策略
# ============================================================
global:
  # 默认穷尽重试链：当所有专用回退都失败时，最终回退到 LLM 内建知识
  final_fallback: "LLM_INTERNAL_REASONING"
  # 健康检查脚本
  health_check_script: "scripts/plugins-health-check.py"
  # 兼容性矩阵文档
  compatibility_matrix_doc: "docs/plugin-compatibility-matrix.md"
  # 插件启用策略：critical 必须启用，optional 可选，supplement 仅在需要时启用
  enable_policy:
    critical: "must_enable"
    optional: "user_choice"
    supplement: "on_demand"
  # 性能基准采集周期（天）
  performance_benchmark_cycle_days: 30
