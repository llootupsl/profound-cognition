# 作者：阿洋
# Profound Cognition v6.0.0 — Plugins Unified Configuration
# 统一插件配置中心：所有插件适配器的注册表、版本、依赖、激活策略集中声明
# 配套文档：docs/plugin-compatibility-matrix.md
# 健康检查：scripts/plugins-health-check.py
#
# 字段说明：
#   name        : 插件唯一标识（与 .md 文件 stem 一致）
#   version     : 适配器版本号
#   category    : 插件分类（search/crawl/render/compress/vector/visual/chart/slide）
#   enabled     : 是否启用（true/false）
#   priority    : 优先级（critical/optional/supplement）
#   endpoint    : 服务端点（如适用）
#   env_var     : 所需环境变量列表
#   min_python  : 最低 Python 版本要求
#   depends_on  : 依赖的其他插件（同名）
#   conflicts_with : 与之冲突的插件（不可同时启用）
#   performance : 性能基准（参见 docs/plugin-compatibility-matrix.md）
#   exhaust_retry_to : 不可用时的穷尽重试回退目标

plugins:
  # ============================================================
  # 搜索类插件（search）
  # ============================================================
  - name: searxng-adapter
    version: "1.1.0"
    category: search
    enabled: true
    priority: critical
    endpoint: "http://{searxng_host}:{port}/search"
    env_var: ["SEARXNG_HOST", "SEARXNG_PORT"]
    min_python: "3.9"
    depends_on: []
    conflicts_with: []
    exhaust_retry_to: [duckduckgo-adapter, whoogle-adapter]
    performance:
      p50_latency_ms: 800
      p95_latency_ms: 2500
      peak_memory_mb: 120
      success_rate: 0.97

  - name: duckduckgo-adapter
