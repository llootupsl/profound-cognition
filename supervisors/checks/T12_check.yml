# 作者：阿洋
task_id: "T12"
task_file: "T12_adversarial_scope.md"

structural_checks:
  - id: S01
    description: "output_schema 中所有 required_fields 是否全部存在"
    severity: CRITICAL
  - id: S02
    description: "输出是否是结构化JSON格式（非自然段落）"
    severity: CRITICAL
  - id: S03
    description: "new_discoveries 字段是否存在且至少含 1 条发现"
    severity: CRITICAL

depth_checks:
  - id: D01
    description: "禁止模糊词扫描：全文搜索(很多|大量|显然|众所周知|长期以来|毫无疑问|毋庸置疑)"
    severity: CRITICAL
    check_method: "regex_scan"
  - id: D02
    description: "是否对所有核心结论执行了边界越界扫描？涵盖：过度泛化/限定条件/时间越界/空间越界/文化越界？有适用范围和失效边界？"
    severity: CRITICAL
  - id: D03
    description: "new_discoveries 是否至少 1 条 cross_reference_potential == HIGH？所有发现 category 是否均为 scope_boundary？"
    severity: CRITICAL
  - id: D04
    description: "每条被攻击结论路径的攻击向量数是否 ≥ 3？"
    severity: CRITICAL
  - id: D05_R5_01
    description: "【R5-01】applied_models 字段是否存在且非空（至少 1 个模型被应用）"
    severity: CRITICAL
  - id: D06_R5_01
    description: "【R5-01】applied_models 中每个条目是否包含 model_id / application_scope / contribution 三个字段"
    severity: CRITICAL
  - id: D07_R5_01
    description: "【R5-01】applied_models 中标注 [EXTRA] 的模型是否有充分理由（≥20字）"
    severity: MAJOR
  - id: D08_R5_01
    description: "【R5-01】recommended_thinking_models 中未被应用的模型是否标注 [SKIPPED] 并说明理由"
    severity: MAJOR
  - id: D09_R5_01
    description: "【R5-01】applied_models 中 model_id 是否在路由表（knowledge/thinking-models/routing-table.md）的 30 个模型清单内"
    severity: CRITICAL
    check_method: "cross_ref_verify"
  - id: D10_A6_10
    description: "【A6.10-F10 / P1-15 修复，Wave 5】scope_limits 列表是否存在且非空？列表长度 >= 2？每个 scope_limit 是否含 dimension / boundary_inclusive / boundary_exclusive / rationale 四要素（缺一不可）？dimension 是否为 spatial|temporal|cultural|methodological|population 之一？"
    severity: CRITICAL
    check_method: "list_completeness_scan"
    required_field: "scope_limits"
    min_length: 2

integrity_checks:
  - id: I01
    description: "所有数字/事实是否有来源标注（L0-L3等级）"
    severity: CRITICAL
  - id: I02
    description: "数据之间是否无矛盾"
    severity: MINOR

constitution_checks:
  - id: C01
    constitution_ref: "P1"
    description: "禁止模糊词数量是否 < 3"
    severity: CRITICAL
  - id: C02
    constitution_ref: "P2"
    description: "必填字段是否无缺失"
    severity: CRITICAL
  - id: C03
    constitution_ref: "P3"
    description: "数据是否有来源标注或与常识不冲突"
    severity: CRITICAL
  - id: C04
    constitution_ref: "P4"
    description: "重试历史是否持续改进（每次重试产出质量是否优于前次）"
    severity: CRITICAL
  - id: C05
    constitution_ref: "P5"
    description: "是否未对已修正项重复判定FAIL"
    severity: CRITICAL
execution_params_check:
  required: true
  description: "检查 execution_params 字段是否存在且达到最低值"
