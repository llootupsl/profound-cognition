# 作者：阿洋
task_id: "T12b"
task_file: "T12b_cross_adversarial_synthesis.md"

structural_checks:
  - id: S01
    description: "cross_adversarial_assessment 字段是否存在且包含 reinforced_attacks、internal_contradictions、unresolved_vulnerabilities 三个子字段"
    severity: CRITICAL
  - id: S02
    description: "reinforced_attacks 是否非空"
    severity: CRITICAL
  - id: S03
    description: "internal_contradictions 是否至少 1 条"
    severity: CRITICAL
  - id: S04
    description: "unresolved_vulnerabilities 是否至少 1 条"
    severity: CRITICAL

depth_checks:
  - id: D01
    description: "禁止模糊词扫描：全文搜索(很多|大量|显然|众所周知|长期以来|毫无疑问|毋庸置疑)"
    severity: CRITICAL
    check_method: "regex_scan"
  - id: D02
    description: "reinforced_attacks 中每条是否都包含 attack、evidence_support、priority 三个字段且 evidence_support 非空"
    severity: CRITICAL
  - id: D03
    description: "reinforced_attacks 是否确实注入了 T11/T12 内容（非简单复述 T10 原始攻击）"
    severity: CRITICAL
  - id: D04
    description: "internal_contradictions 中每条是否都包含 t10_position 和 t11_or_t12_position 且两者立场不同"
    severity: CRITICAL
  - id: D05
    description: "priority 是否有区分度（不可全部相同）"
    severity: HIGH

integrity_checks:
  - id: I01
    description: "所有数字/事实是否有来源标注（T10/T11/T12引用）"
    severity: CRITICAL
  - id: I02
    description: "reinforced_attacks 中的攻击是否与 T10 原始攻击存在对应关系"
    severity: HIGH

constitution_checks:
  - id: C01
    constitution_ref: "P1"
    description: "禁止模糊词数量是否 < 3"
    severity: CRITICAL
  - id: C02
    constitution_ref: "P2"
    description: "必填字段是否无缺失（reinforced_attacks、internal_contradictions、unresolved_vulnerabilities）"
    severity: CRITICAL
  - id: C03
    constitution_ref: "P3"
    description: "数据是否有来源标注或与常识不冲突"
    severity: CRITICAL
  - id: C04
    constitution_ref: "P4"
    description: "重试历史是否持续改进（每次重试产出质量是否优于前次）"
    severity: CRITICAL
  - id: C05
    constitution_ref: "P5"
    description: "是否未对已修正项重复判定FAIL"
    severity: CRITICAL
