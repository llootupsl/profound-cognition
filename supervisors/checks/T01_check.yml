# 作者：阿洋
task_id: "T01"
task_file: "tasks/T01_input_triage.md"

structural_checks:
  - id: S01
    description: "output_schema 中所有 required_fields 是否全部存在"
    severity: CRITICAL
  - id: S02
    description: "输出是否是结构化JSON格式（非自然段落）"
    severity: CRITICAL

depth_checks:
  - id: D01
    description: "禁止模糊词扫描：全文搜索(很多|大量|显然|众所周知|长期以来|毫无疑问|毋庸置疑)"
    severity: CRITICAL
    check_method: "regex_scan"
  - id: D02
    description: "对象分类是否准确？偏见扫描是否覆盖5类偏见预设？敏感度等级是否有依据？"
    severity: CRITICAL
  - id: D03
    description: "对象分类是否与 object-router.md 路由规则一致"
    severity: CRITICAL
  - id: D04
    description: "偏见扫描结果是否与 geo-shield.md 检测规则一致"
    severity: CRITICAL
  - id: D05
    description: "敏感度等级是否与 sensitivity-framework.md 分级标准一致"
    severity: CRITICAL
  - id: D06
    description: "output_type 是否为合法枚举值？（仅接受 research_report | wechat_article | course_material 三者之一）"
    severity: CRITICAL
  - id: D07
    description: "若 output_type == course_material，output_subtype 是否为合法值？（仅接受 lecture | video_script）"
    severity: CRITICAL
  - id: D08
    description: "若检测到旧版输出类型关键词，T01_legacy_mapping 是否已正确执行？output_type 是否已映射为 v3 的 3 种类型之一？"
    severity: CRITICAL

integrity_checks:
  - id: I01
    description: "所有数字/事实是否有来源标注（L0-L3等级）"
    severity: CRITICAL
  - id: I02
    description: "数据之间是否无矛盾"
    severity: MINOR

constitution_checks:
  - id: C01
    constitution_ref: "P1"
    description: "禁止模糊词数量是否 < 3"
    severity: CRITICAL
  - id: C02
    constitution_ref: "P2"
    description: "必填字段是否无缺失"
    severity: CRITICAL
  - id: C03
    constitution_ref: "P3"
    description: "数据是否有来源标注或与常识不冲突"
    severity: CRITICAL
  - id: C04
    constitution_ref: "P4"
    description: "重试历史是否持续改进（每次重试产出质量是否优于前次）"
    severity: CRITICAL
  - id: C05
    constitution_ref: "P5"
    description: "是否未对已修正项重复判定FAIL"
    severity: CRITICAL
execution_params_check:
  required: true
  description: "检查 execution_params 字段是否存在且达到最低值"
