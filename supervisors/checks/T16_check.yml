# 作者：阿洋
node: T16
desc: "Gate-γ 领域分析门控"
critical_path: true
checks:
  - id: GG-C01
    type: completeness
    severity: CRITICAL
    desc: "领域引擎覆盖度检查是否完成"
    validate: "output.domain_engine_coverage 含 T00 推荐的全部领域引擎及覆盖状态"
  - id: GG-C02
    type: completeness
    severity: CRITICAL
    desc: "Phase 3 节点状态枚举是否完成"
    validate: "output.node_status_enumeration 含 T15/T15b 等全部 Phase 3 节点的执行状态（COMPLETED/SKIPPED/FAILED）"
  - id: GG-C03
    type: quality
    severity: CRITICAL
    desc: "SKIPPED 节点视为 COMPLETED（SKIPPED==COMPLETED 规则）"
    validate: "所有 status=='SKIPPED' 的节点视为 COMPLETED，不触发 WARNING"
  - id: GG-C04
    type: quality
    severity: CRITICAL
    desc: "T00 推荐的领域引擎全部覆盖"
    validate: "output.domain_engine_coverage 中 recommended_engines 全部标记为 covered"
  - id: GG-C05
    type: quality
    severity: HIGH
    desc: "FAIL 退回路径是否正确"
    validate: "decision=='FAIL'时 return_target == 'T15'（退回至 T15 补充缺失领域）"
  - id: GG-C06
    type: quality
    severity: MEDIUM
    desc: "PASS/FAIL/WARN 决策是否明确"
    validate: "output.decision ∈ {PASS, FAIL, WARN}"
