# 作者：阿洋
task_id: "T08"
task_file: "T08_cog_deconstruct.md"

structural_checks:
  - id: S01
    description: "output_schema 中所有 required_fields 是否全部存在"
    severity: CRITICAL
  - id: S02
    description: "输出是否是结构化JSON格式（非自然段落）"
    severity: CRITICAL

depth_checks:
  - id: D01
    description: "禁止模糊词扫描：全文搜索(很多|大量|显然|众所周知|长期以来|毫无疑问|毋庸置疑)"
    severity: CRITICAL
    check_method: "regex_scan"
  - id: D02
    description: "子问题是否MECE？是否有覆盖缺口？隐含假设≥3个+1个反事实假设？新增分析维度≥1个？P0子问题≤30%？"
    severity: CRITICAL
  - id: D03_R5_01
    description: "【R5-01】applied_models 字段是否存在且非空（至少 1 个模型被应用）"
    severity: CRITICAL
  - id: D04_R5_01
    description: "【R5-01】applied_models 中每个条目是否包含 model_id / application_scope / contribution 三个字段"
    severity: CRITICAL
  - id: D05_R5_01
    description: "【R5-01】applied_models 中标注 [EXTRA] 的模型是否有充分理由（≥20字）"
    severity: MAJOR
  - id: D06_R5_01
    description: "【R5-01】recommended_thinking_models 中未被应用的模型是否标注 [SKIPPED] 并说明理由"
    severity: MAJOR
  - id: D07_R5_01
    description: "【R5-01】applied_models 中 model_id 是否在路由表（knowledge/thinking-models/routing-table.md）的 30 个模型清单内"
    severity: CRITICAL
    check_method: "cross_ref_verify"

integrity_checks:
  - id: I01
    description: "所有数字/事实是否有来源标注（L0-L3等级）"
    severity: CRITICAL
  - id: I02
    description: "数据之间是否无矛盾"
    severity: MINOR

constitution_checks:
  - id: C01
    constitution_ref: "P1"
    description: "禁止模糊词数量是否 < 3"
    severity: CRITICAL
  - id: C02
    constitution_ref: "P2"
    description: "必填字段是否无缺失"
    severity: CRITICAL
  - id: C03
    constitution_ref: "P3"
    description: "数据是否有来源标注或与常识不冲突"
    severity: CRITICAL
  - id: C04
    constitution_ref: "P4"
    description: "重试历史是否持续改进（每次重试产出质量是否优于前次）"
    severity: CRITICAL
  - id: C05
    constitution_ref: "P5"
    description: "是否未对已修正项重复判定FAIL"
    severity: CRITICAL
execution_params_check:
  required: true
  description: "检查 execution_params 字段是否存在且达到最低值"

lightrag_checks:
  - id: LR01
    description: "LightRAG 检索相关性分数：retrieval_results[*].score 均值是否 ≥ 0.7（< 0.7 触发索引重建或回退到简单向量搜索）"
    severity: MAJOR
    check_method: "numeric_threshold"
    required_field: "retrieval_scores_mean"
    threshold: 0.7
    on_fail: "trigger_reindex_or_vector_search"
  - id: LR02
    description: "LightRAG 检索覆盖率：retrieval_results 数组长度 / top_k 是否 == 1.0（< 1.0 表示索引不完整）"
    severity: MINOR
    check_method: "numeric_threshold"
    required_field: "retrieval_coverage"
    threshold: 1.0
  - id: LR03
    description: "LightRAG 查询模式合法性：query_mode 是否为 local|hybrid|global|naive 之一"
    severity: MAJOR
    check_method: "enum_value_check"
    required_field: "query_mode"
    allowed_values: ["local", "hybrid", "global", "naive"]
  - id: LR04
    description: "LightRAG 检索延迟：retrieval_latency_ms 是否 ≤ 5000（> 5000ms 触发 hybrid→naive 回退）"
    severity: MINOR
    check_method: "numeric_threshold"
    required_field: "retrieval_latency_ms"
    threshold: 5000
    on_fail: "switch_to_naive"
