# 作者：阿洋
# 执行顺序一致性检查：T22→T19→T28→T17（链路本身无环，此为执行指引）
task_id: "T17"
task_file: "tasks/T17_quality_factcheck.md"

structural_checks:
  - id: S01
    description: "output_schema 中所有 required_fields 是否全部存在"
    severity: CRITICAL
  - id: S02
    description: "输出是否是结构化JSON格式（非自然段落）"
    severity: CRITICAL
  - id: S03
    description: "php_feedback 三个必需字段是否全部存在：correction_required、corrected_assertions、correction_rationale"
    severity: CRITICAL

depth_checks:
  - id: D01
    description: "禁止模糊词扫描：全文搜索(很多|大量|显然|众所周知|长期以来|毫无疑问|毋庸置疑)"
    severity: CRITICAL
    check_method: "regex_scan"
  - id: D02
    description: "CoVe三阶段是否完整：分解→独立验证→比对？独立验证是否未使用前序上下文？≥20%断言无法验证时是否标注待穷尽重试？"
    severity: CRITICAL
  - id: D03
    description: "PHP回环正确性：is_best_answer_hint==true 的断言是否执行了3轮独立验证？verification_rounds字段是否与断言类型一致？"
    severity: CRITICAL

integrity_checks:
  - id: I01
    description: "所有数字/事实是否有来源标注（L0-L3等级）"
    severity: CRITICAL
  - id: I02
    description: "数据之间是否无矛盾"
    severity: MINOR
  - id: I03
    description: "php_feedback 一致性：correction_required==true 时 corrected_assertions 是否非空？correction_required==false 时 corrected_assertions 是否为空？"
    severity: CRITICAL
  - id: I04
    description: "correction_required==true 时 correction_rationale 是否非空且有实质内容（非占位文本）？"
    severity: MAJOR

constitution_checks:
  - id: C01
    constitution_ref: "P1"
    description: "禁止模糊词数量是否 < 3"
    severity: CRITICAL
  - id: C02
    constitution_ref: "P2"
    description: "必填字段是否无缺失"
    severity: CRITICAL
  - id: C03
    constitution_ref: "P3"
    description: "数据是否有来源标注或与常识不冲突"
    severity: CRITICAL
  - id: C04
    constitution_ref: "P4"
    description: "重试历史是否持续改进（每次重试产出质量是否优于前次）"
    severity: CRITICAL
  - id: C05
    constitution_ref: "P5"
    description: "是否未对已修正项重复判定FAIL"
    severity: CRITICAL