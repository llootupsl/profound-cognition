# 作者：阿洋
task_id: "T20"
task_file: "tasks/T20a_research_render.md | tasks/T20b_wechat_render.md | tasks/T20c_course_render.md"
render_routing:
  research_report: "T20a_research_render"
  wechat_article: "T20b_wechat_render"
  course_material: "T20c_course_render"

structural_checks:
  - id: S01
    description: "output_schema 中所有 required_fields 是否全部存在"
    severity: CRITICAL
  - id: S02
    description: "输出是否是结构化JSON格式（非自然段落）"
    severity: CRITICAL

depth_checks:
  - id: D01
    description: "禁止模糊词扫描：全文搜索(很多|大量|显然|众所周知|长期以来|毫无疑问|毋庸置疑)"
    severity: CRITICAL
    check_method: "regex_scan"
  - id: D02
    description: "是否剥离了所有内部评分和verdict？是否选择了正确的成品类型渲染模板（T20a/T20b/T20c三路由）？是否未添加流水线未产出的新内容？"
    severity: CRITICAL
  - id: D03
    description: "T20a_research_render：研究渲染输出字数是否 ≥ 100000字？Typst 排版是否正确？"
    severity: CRITICAL
  - id: D04
    description: "T20b_wechat_render：公众号文章字数是否在 3000-5000 字范围？人设叙事是否一致？能力卡片是否精选引用？"
    severity: CRITICAL
  - id: D05
    description: "T20c_course_render：课程材料是否按模块组织？讲义/视频脚本双模态是否正确区分？"

integrity_checks:
  - id: I01
    description: "所有数字/事实是否有来源标注（L0-L3等级）"
    severity: CRITICAL
  - id: I02
    description: "数据之间是否无矛盾"
    severity: MINOR

constitution_checks:
  - id: C01
    constitution_ref: "P1"
    description: "禁止模糊词数量是否 < 3"
    severity: CRITICAL
  - id: C02
    constitution_ref: "P2"
    description: "必填字段是否无缺失"
    severity: CRITICAL
  - id: C03
    constitution_ref: "P3"
    description: "数据是否有来源标注或与常识不冲突"
    severity: CRITICAL
  - id: C04
    constitution_ref: "P4"
    description: "重试历史是否持续改进（每次重试产出质量是否优于前次）"
    severity: CRITICAL
  - id: C05
    constitution_ref: "P5"
    description: "是否未对已修正项重复判定FAIL"
    severity: CRITICAL