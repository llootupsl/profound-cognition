# 作者：阿洋
task_id: "T02"
task_file: "tasks/T02_L1_L2_research.md"

structural_checks:
  - id: S01
    description: "output_schema 中所有 required_fields 是否全部存在"
    severity: CRITICAL
  - id: S02
    description: "输出是否是结构化JSON格式（非自然段落）"
    severity: CRITICAL

depth_checks:
  - id: D01
    description: "禁止模糊词扫描：全文搜索(很多|大量|显然|众所周知|长期以来|毫无疑问|毋庸置疑)"
    severity: CRITICAL
    check_method: "regex_scan"
  - id: D02
    description: "L1事实清单≥25条？L2时间节点表≥10行且每行四列完整？时期划分≥2个？转折点≥2个？每个事实有来源等级标注？"
    severity: CRITICAL
  - id: D03
    description: "L2 时间演化 ≥5 个时间节点"
    severity: CRITICAL
  - id: D04_A6_10
    description: "【A6.10-F3 / P1-12 修复，Wave 5】paper_count 是否存在且为正整数（1 <= paper_count <= 100000）？citation_count 是否存在且为非负整数（0 <= citation_count <= 1000000）？citation_count 是否 >= paper_count（引用数不应少于论文数，除非 paper_count == 0）？"
    severity: CRITICAL
    check_method: "numeric_range_check"
    required_fields: ["paper_count", "citation_count"]

integrity_checks:
  - id: I01
    description: "所有数字/事实是否有来源标注（L0-L3等级）"
    severity: CRITICAL
  - id: I02
    description: "数据之间是否无矛盾"
    severity: MINOR

constitution_checks:
  - id: C01
    constitution_ref: "P1"
    description: "禁止模糊词数量是否 < 3"
    severity: CRITICAL
  - id: C02
    constitution_ref: "P2"
    description: "必填字段是否无缺失"
    severity: CRITICAL
  - id: C03
    constitution_ref: "P3"
    description: "数据是否有来源标注或与常识不冲突"
    severity: CRITICAL
  - id: C04
    constitution_ref: "P4"
    description: "重试历史是否持续改进（每次重试产出质量是否优于前次）"
    severity: CRITICAL
  - id: C05
    constitution_ref: "P5"
    description: "是否未对已修正项重复判定FAIL"
    severity: CRITICAL

retrieval_checks:
  - name: M5_force_retrieval
    description: "强制检索触发器覆盖率"
    check:
      - field: M5_trigger_coverage
        condition: "gte"
        value: 7
        on_fail: "9 类强制检索触发器覆盖不足 7/9，退回 T02 补充检索"
      - field: M5_empty_citation
        condition: "eq"
        value: 0
        on_fail: "存在'据悉/据研究'等无具体来源的空引用，退回 T02 补充来源"
execution_params_check:
  required: true
  description: "检查 execution_params 字段是否存在且达到最低值"

paperqa2_checks:
  - id: PQA01
    description: "PaperQA2 引用覆盖率：review_output.citations 数组是否非空且 ≥ 3 条（确保多源交叉验证）"
    severity: CRITICAL
    check_method: "field_exists_and_non_empty"
    required_field: "citations"
    min_count: 3
  - id: PQA02
    description: "PaperQA2 综述质量评级：review_quality 是否为 HIGH|MEDIUM|LOW 之一且非 LOW（LOW 触发重试）"
    severity: MAJOR
    check_method: "enum_value_check"
    required_field: "review_quality"
    allowed_values: ["HIGH", "MEDIUM", "LOW"]
    on_fail: "trigger_retry_when_low"
  - id: PQA03
    description: "PaperQA2 引用网络遍历深度：citation_network_depth 是否 ≥ 2（确保引用网络深度至少 2 层）"
    severity: MAJOR
    check_method: "numeric_threshold"
    required_field: "citation_network_depth"
    threshold: 2
  - id: PQA04
    description: "PaperQA2 检索相关性分数：retrieval_scores 均值是否 ≥ 0.7（< 0.7 触发索引重建）"
    severity: MAJOR
    check_method: "numeric_threshold"
    required_field: "retrieval_scores_mean"
    threshold: 0.7
    on_fail: "trigger_reindex"
