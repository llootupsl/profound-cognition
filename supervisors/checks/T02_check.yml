# 作者：阿洋
task_id: "T02"
task_file: "tasks/T02_L1_L2_research.md"

structural_checks:
  - id: S01
    description: "output_schema 中所有 required_fields 是否全部存在"
    severity: CRITICAL
  - id: S02
    description: "输出是否是结构化JSON格式（非自然段落）"
    severity: CRITICAL

depth_checks:
  - id: D01
    description: "禁止模糊词扫描：全文搜索(很多|大量|显然|众所周知|长期以来|毫无疑问|毋庸置疑)"
    severity: CRITICAL
    check_method: "regex_scan"
  - id: D02
    description: "L1事实清单≥25条？L2时间节点表≥10行且每行四列完整？时期划分≥2个？转折点≥2个？每个事实有来源等级标注？"
    severity: CRITICAL
  - id: D03
    description: "L2 时间演化 ≥5 个时间节点"
    severity: CRITICAL

integrity_checks:
  - id: I01
    description: "所有数字/事实是否有来源标注（L0-L3等级）"
    severity: CRITICAL
  - id: I02
    description: "数据之间是否无矛盾"
    severity: MINOR

constitution_checks:
  - id: C01
    constitution_ref: "P1"
    description: "禁止模糊词数量是否 < 3"
    severity: CRITICAL
  - id: C02
    constitution_ref: "P2"
    description: "必填字段是否无缺失"
    severity: CRITICAL
  - id: C03
    constitution_ref: "P3"
    description: "数据是否有来源标注或与常识不冲突"
    severity: CRITICAL
  - id: C04
    constitution_ref: "P4"
    description: "重试历史是否持续改进（每次重试产出质量是否优于前次）"
    severity: CRITICAL
  - id: C05
    constitution_ref: "P5"
    description: "是否未对已修正项重复判定FAIL"
    severity: CRITICAL

retrieval_checks:
  - name: M5_force_retrieval
    description: "强制检索触发器覆盖率"
    check:
      - field: M5_trigger_coverage
        condition: "gte"
        value: 7
        on_fail: "9 类强制检索触发器覆盖不足 7/9，退回 T02 补充检索"
      - field: M5_empty_citation
        condition: "eq"
        value: 0
        on_fail: "存在'据悉/据研究'等无具体来源的空引用，退回 T02 补充来源"