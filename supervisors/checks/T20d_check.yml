task_id: "T20d"
task_file: "tasks/T20d_cross_media_review.md"

structural_checks:
  - id: S01
    description: "review_findings 非空"
    severity: CRITICAL
  - id: S02
    description: "consistency_score 字段存在且为数值类型"
    severity: CRITICAL
  - id: S03
    description: "至少包含 1 条跨媒介一致性建议"
    severity: CRITICAL

depth_checks:
  - id: D01
    description: "consistency_score 值在 0-1 范围内且与 review_findings 论证一致"
    severity: CRITICAL
  - id: D02
    description: "跨媒介一致性建议具体可操作，非模糊表述"
    severity: CRITICAL
  - id: D03
    description: "review_findings 覆盖所有已激活的输出媒介类型"
    severity: CRITICAL

integrity_checks:
  - id: I01
    description: "review_findings 与上游 T20 输出内容无矛盾"
    severity: MINOR
  - id: I02
    description: "数据之间是否无矛盾"
    severity: MINOR

constitution_checks:
  - id: C01
    constitution_ref: "P1"
    description: "禁止模糊词数量是否 < 3"
    severity: CRITICAL
  - id: C02
    constitution_ref: "P2"
    description: "必填字段是否无缺失"
    severity: CRITICAL
  - id: C03
    constitution_ref: "P3"
    description: "数据是否有来源标注或与常识不冲突"
    severity: CRITICAL
  - id: C04
    constitution_ref: "P4"
    description: "重试历史是否持续改进（每次重试产出质量是否优于前次）"
    severity: CRITICAL
  - id: C05
    constitution_ref: "P5"
    description: "是否未对已修正项重复判定FAIL"
    severity: CRITICAL
execution_params_check:
  required: true
  description: "检查 execution_params 字段是否存在且达到最低值"
